name: Namello Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Namello 1.0.31 Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:

      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          set -e

          echo "========================================"
          echo "ANDROID SDK"
          echo "========================================"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify toolchain
        run: |
          set -e

          echo "========================================"
          echo "TOOLCHAIN"
          echo "========================================"

          node --version
          npm --version
          java -version
          adb version

      - name: Locate Namello PWA project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "LOCATING NAMELLO PWA"
          echo "========================================"

          echo ""
          echo "Repository:"
          pwd

          echo ""
          echo "Repository tree:"
          find . \
            -maxdepth 4 \
            -type f \
            \( \
              -name "package.json" \
              -o -name "vite.config.ts" \
              -o -name "capacitor.config.ts" \
            \) \
            -print \
            | sort

          PROJECT_DIR=""

          while IFS= read -r PACKAGE_FILE; do

            DIR="$(dirname "$PACKAGE_FILE")"

            echo ""
            echo "Checking:"
            echo "$DIR/package.json"

            if [ ! -f "$DIR/package.json" ]; then
              continue
            fi

            if [ ! -f "$DIR/vite.config.ts" ]; then
              continue
            fi

            if [ ! -f "$DIR/capacitor.config.ts" ]; then
              continue
            fi

            IS_NAMELLO_PWA="$(
              node - "$DIR/package.json" <<'NODE'
          const fs = require('fs');

          const file = process.argv[2];

          try {
            const p = JSON.parse(
              fs.readFileSync(file, 'utf8')
            );

            const isPwa =
              p.name === 'namello-pwa' &&
              p.version === '1.0.31' &&
              p.scripts &&
              p.scripts.build === 'vite build';

            process.stdout.write(isPwa ? 'YES' : 'NO');
          } catch {
            process.stdout.write('NO');
          }
          NODE
            )"

            if [ "$IS_NAMELLO_PWA" = "YES" ]; then
              PROJECT_DIR="$DIR"
              break
            fi

          done < <(
            find . \
              -maxdepth 5 \
              -type f \
              -name package.json \
              -print \
              | sort
          )

          if [ -z "$PROJECT_DIR" ]; then

            echo ""
            echo "========================================"
            echo "ERROR: NAMELLO PWA NOT FOUND"
            echo "========================================"

            echo ""
            echo "All package.json files:"

            find . \
              -maxdepth 6 \
              -type f \
              -name package.json \
              -print \
              | sort

            echo ""
            echo "Their package names and versions:"

            while IFS= read -r PACKAGE_FILE; do
              node - "$PACKAGE_FILE" <<'NODE'
          const fs = require('fs');

          const file = process.argv[2];

          try {
            const p = JSON.parse(
              fs.readFileSync(file, 'utf8')
            );

            console.log(
              `${file} -> name=${p.name || 'unknown'}, version=${p.version || 'unknown'}, build=${p.scripts?.build || 'none'}`
            );
          } catch (e) {
            console.log(`${file} -> INVALID JSON`);
          }
          NODE
            done < <(
              find . \
                -maxdepth 6 \
                -type f \
                -name package.json \
                -print \
                | sort
            )

            exit 1
          fi

          echo ""
          echo "========================================"
          echo "NAMELLO PWA FOUND"
          echo "========================================"

          echo "PROJECT_DIR=$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Project files:"
          ls -la "$PROJECT_DIR"

      - name: Verify Namello PWA package
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING NAMELLO PWA PACKAGE"
          echo "========================================"

          cd "$PROJECT_DIR"

          test -f package.json
          test -f vite.config.ts
          test -f capacitor.config.ts

          node - <<'NODE'
          const fs = require('fs');

          const p = JSON.parse(
            fs.readFileSync('package.json', 'utf8')
          );

          console.log('name:', p.name);
          console.log('version:', p.version);
          console.log('build:', p.scripts?.build);

          if (p.name !== 'namello-pwa') {
            throw new Error(
              `Wrong package selected: ${p.name}`
            );
          }

          if (p.version !== '1.0.31') {
            throw new Error(
              `Expected Namello PWA 1.0.31, found ${p.version}`
            );
          }

          if (p.scripts?.build !== 'vite build') {
            throw new Error(
              'Namello PWA build script is not "vite build"'
            );
          }

          console.log('Namello PWA package verified.');
          NODE

      - name: Install Namello PWA dependencies
        run: |
          set -e

          echo "========================================"
          echo "INSTALLING NAMELLO PWA DEPENDENCIES"
          echo "========================================"

          cd "$PROJECT_DIR"

          npm install \
            --include=dev \
            --no-audit \
            --no-fund

      - name: Verify Vite and Capacitor dependencies
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING BUILD DEPENDENCIES"
          echo "========================================"

          cd "$PROJECT_DIR"

          echo ""
          echo "Vite:"
          ./node_modules/.bin/vite --version

          echo ""
          echo "TypeScript:"
          ./node_modules/.bin/tsc --version

          echo ""
          echo "Capacitor:"
          ./node_modules/.bin/cap --version

          echo ""
          echo "Capacitor Core:"
          node -e "console.log(require.resolve('@capacitor/core'))"

          echo ""
          echo "Capacitor Android:"
          node -e "console.log(require.resolve('@capacitor/android'))"

          echo ""
          echo "All Namello PWA dependencies are installed."

      - name: Verify Namello version
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING NAMELLO VERSION"
          echo "========================================"

          cd "$PROJECT_DIR"

          test -f version.json

          cat version.json

          node - <<'NODE'
          const fs = require('fs');

          const v = JSON.parse(
            fs.readFileSync('version.json', 'utf8')
          );

          if (v.version !== '1.0.31') {
            throw new Error(
              `Expected version 1.0.31, found ${v.version}`
            );
          }

          if (v.versionCode !== 32) {
            throw new Error(
              `Expected versionCode 32, found ${v.versionCode}`
            );
          }

          console.log('Namello version:', v.version);
          console.log('Namello versionCode:', v.versionCode);
          console.log('Version contract OK.');
          NODE

      - name: Run tests
        run: |
          set -e

          echo "========================================"
          echo "RUNNING TESTS"
          echo "========================================"

          cd "$PROJECT_DIR"

          npm run test

      - name: TypeScript check
        run: |
          set -e

          echo "========================================"
          echo "TYPESCRIPT CHECK"
          echo "========================================"

          cd "$PROJECT_DIR"

          npm run typecheck

      - name: Build web application
        run: |
          set -e

          echo "========================================"
          echo "BUILDING NAMELLO PWA"
          echo "========================================"

          cd "$PROJECT_DIR"

          npm run build

      - name: Verify web build
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING WEB BUILD"
          echo "========================================"

          cd "$PROJECT_DIR"

          test -d dist
          test -s dist/index.html

          echo ""
          echo "dist/index.html:"
          ls -lh dist/index.html

          echo ""
          echo "DIST CONTENT:"

          find dist \
            -maxdepth 5 \
            -type f \
            | sort \
            | head -500

      - name: Verify launcher assets
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING NAMELLO ASSETS"
          echo "========================================"

          cd "$PROJECT_DIR"

          test -s assets/icon-only.png
          test -s icon-192.png
          test -s icon-512.png

          echo ""
          echo "Launcher icon:"
          ls -lh assets/icon-only.png

          echo ""
          echo "PWA icons:"
          ls -lh icon-192.png
          ls -lh icon-512.png

      - name: Add Capacitor Android platform
        run: |
          set -e

          echo "========================================"
          echo "ADDING CAPACITOR ANDROID"
          echo "========================================"

          cd "$PROJECT_DIR"

          rm -rf android

          ./node_modules/.bin/cap add android

          test -d android
          test -d android/app

          echo "Capacitor Android project created."

      - name: Set Android app version
        run: |
          set -e

          echo "========================================"
          echo "SETTING ANDROID VERSION"
          echo "========================================"

          cd "$PROJECT_DIR"

          APP_GRADLE="android/app/build.gradle"

          test -f "$APP_GRADLE"

          sed -i \
            's/versionCode [0-9]*/versionCode 32/' \
            "$APP_GRADLE"

          sed -i \
            's/versionName "[^"]*"/versionName "1.0.31"/' \
            "$APP_GRADLE"

          grep -nE \
            'versionCode|versionName' \
            "$APP_GRADLE"

      - name: Install Namello launcher icon
        run: |
          set -e

          echo "========================================"
          echo "INSTALLING NAMELLO LAUNCHER ICON"
          echo "========================================"

          cd "$PROJECT_DIR"

          mkdir -p \
            android/app/src/main/res/drawable-nodpi

          cp \
            assets/icon-only.png \
            android/app/src/main/res/drawable-nodpi/namello_launcher.png

          test -s \
            android/app/src/main/res/drawable-nodpi/namello_launcher.png

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST"

          sed -i \
            's#android:icon="@mipmap/ic_launcher"#android:icon="@drawable/namello_launcher"#g' \
            "$MANIFEST"

          sed -i \
            's#android:roundIcon="@mipmap/ic_launcher_round"#android:roundIcon="@drawable/namello_launcher"#g' \
            "$MANIFEST"

          echo "Namello launcher icon installed."

      - name: Sync Capacitor Android
        run: |
          set -e

          echo "========================================"
          echo "CAPACITOR SYNC"
          echo "========================================"

          cd "$PROJECT_DIR"

          ./node_modules/.bin/cap sync android

      - name: Verify Android version
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING ANDROID VERSION"
          echo "========================================"

          cd "$PROJECT_DIR"

          APP_GRADLE="android/app/build.gradle"

          VERSION_CODE="$(
            grep -oE \
              'versionCode [0-9]+' \
              "$APP_GRADLE" \
              | head -1 \
              | awk '{print $2}'
          )"

          VERSION_NAME="$(
            grep -oE \
              'versionName "[^"]+"' \
              "$APP_GRADLE" \
              | head -1 \
              | sed 's/versionName //;s/"//g'
          )"

          echo "versionCode: $VERSION_CODE"
          echo "versionName: $VERSION_NAME"

          test "$VERSION_CODE" = "32"
          test "$VERSION_NAME" = "1.0.31"

      - name: Build debug APK
        run: |
          set -e

          echo "========================================"
          echo "BUILDING NAMELLO ANDROID APK"
          echo "========================================"

          cd "$PROJECT_DIR/android"

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Verify APK
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING APK"
          echo "========================================"

          APK_PATH="$PROJECT_DIR/android/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK_PATH"

          mkdir -p namello-apk

          cp \
            "$APK_PATH" \
            namello-apk/Namello-1.0.31-debug.apk

          ls -lh namello-apk/Namello-1.0.31-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Namello-1.0.31-APK
          path: namello-apk/Namello-1.0.31-debug.apk
          if-no-files-found: error
          retention-days: 14
