name: Namello Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Namello 1.0.31 Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout source
        uses: actions/checkout@v7


      # =========================================================
      # 2. NODE.JS
      # =========================================================
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22


      # =========================================================
      # 3. JAVA 21
      # =========================================================
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"


      # =========================================================
      # 4. ANDROID SDK
      # =========================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''


      # =========================================================
      # 5. INSTALL ANDROID SDK PACKAGES
      # =========================================================
      - name: Install Android SDK packages
        run: |
          set -e

          echo "========================================"
          echo "ANDROID SDK"
          echo "========================================"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # =========================================================
      # 6. VERIFY TOOLCHAIN
      # =========================================================
      - name: Verify toolchain
        run: |
          set -e

          echo "========================================"
          echo "TOOLCHAIN"
          echo "========================================"

          node --version
          npm --version
          java -version
          adb version


      # =========================================================
      # 7. FIND NAMELLO PROJECT DIRECTORY
      # =========================================================
      - name: Find Namello project directory
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "FINDING NAMELLO PROJECT"
          echo "========================================"

          echo "Repository root:"
          pwd

          echo ""
          echo "Top-level files:"
          ls -la

          PROJECT_DIR=""

          # Case 1: package.json is at repository root
          if [ -f "package.json" ] && [ -f "vite.config.ts" ]; then
            PROJECT_DIR="."
          fi

          # Case 2: Namello is inside a subdirectory
          if [ -z "$PROJECT_DIR" ]; then
            FOUND_PACKAGE="$(
              find . \
                -maxdepth 3 \
                -type f \
                -name package.json \
                -print \
                | while read -r p; do
                    d="$(dirname "$p")"
                    if [ -f "$d/vite.config.ts" ] && [ -f "$d/capacitor.config.ts" ]; then
                      echo "$d"
                      break
                    fi
                  done
            )"

            if [ -n "$FOUND_PACKAGE" ]; then
              PROJECT_DIR="$FOUND_PACKAGE"
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo ""
            echo "ERROR: Namello project directory could not be found."
            echo ""
            echo "Searching for package.json files:"
            find . \
              -maxdepth 4 \
              -type f \
              -name package.json \
              -print \
              | sort
            exit 1
          fi

          # Normalize ./ to empty path for root
          if [ "$PROJECT_DIR" = "." ]; then
            PROJECT_DIR="."
          fi

          echo ""
          echo "Namello project directory:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Project files:"
          ls -la "$PROJECT_DIR"

          echo ""

          test -f "$PROJECT_DIR/package.json"
          test -f "$PROJECT_DIR/vite.config.ts"
          test -f "$PROJECT_DIR/capacitor.config.ts"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # =========================================================
      # 8. VERIFY PROJECT
      # =========================================================
      - name: Verify Namello project
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING NAMELLO PROJECT"
          echo "========================================"

          echo "PROJECT_DIR=$PROJECT_DIR"

          test -f "$PROJECT_DIR/package.json"
          test -f "$PROJECT_DIR/vite.config.ts"
          test -f "$PROJECT_DIR/capacitor.config.ts"

          echo ""
          echo "package.json:"
          cat "$PROJECT_DIR/package.json"


      # =========================================================
      # 9. INSTALL DEPENDENCIES
      # =========================================================
      - name: Install dependencies
        run: |
          set -e

          echo "========================================"
          echo "INSTALLING NAMELLO DEPENDENCIES"
          echo "========================================"

          cd "$PROJECT_DIR"

          npm install \
            --no-audit \
            --no-fund


      # =========================================================
      # 10. VERIFY NPM DEPENDENCIES
      # =========================================================
      - name: Verify build dependencies
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING BUILD DEPENDENCIES"
          echo "========================================"

          cd "$PROJECT_DIR"

          echo ""
          echo "Vite:"
          ./node_modules/.bin/vite --version

          echo ""
          echo "TypeScript:"
          ./node_modules/.bin/tsc --version

          echo ""
          echo "Capacitor:"
          ./node_modules/.bin/cap --version

          echo ""
          echo "Capacitor Core:"
          node -e "console.log(require.resolve('@capacitor/core'))"

          echo ""
          echo "Capacitor Android:"
          node -e "console.log(require.resolve('@capacitor/android'))"

          echo ""
          echo "All required dependencies are available."


      # =========================================================
      # 11. VERIFY VERSION
      # =========================================================
      - name: Verify Namello version
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING NAMELLO VERSION"
          echo "========================================"

          cd "$PROJECT_DIR"

          test -f version.json

          echo ""
          echo "version.json:"
          cat version.json

          node - <<'NODE'
          const fs = require('fs');

          const v = JSON.parse(
            fs.readFileSync('version.json', 'utf8')
          );

          console.log('Application version:', v.version);
          console.log('Application versionCode:', v.versionCode);

          if (v.version !== '1.0.31') {
            throw new Error(
              `Expected version 1.0.31, found ${v.version}`
            );
          }

          if (v.versionCode !== 32) {
            throw new Error(
              `Expected versionCode 32, found ${v.versionCode}`
            );
          }

          console.log('Namello version contract OK.');
          NODE


      # =========================================================
      # 12. RUN TESTS
      # =========================================================
      - name: Run tests
        run: |
          set -e

          echo "========================================"
          echo "RUNNING TESTS"
          echo "========================================"

          cd "$PROJECT_DIR"

          npm run test


      # =========================================================
      # 13. TYPESCRIPT CHECK
      # =========================================================
      - name: TypeScript check
        run: |
          set -e

          echo "========================================"
          echo "TYPESCRIPT CHECK"
          echo "========================================"

          cd "$PROJECT_DIR"

          npm run typecheck


      # =========================================================
      # 14. BUILD WEB APPLICATION
      # =========================================================
      - name: Build web application
        run: |
          set -e

          echo "========================================"
          echo "BUILDING NAMELLO WEB APPLICATION"
          echo "========================================"

          cd "$PROJECT_DIR"

          npm run build


      # =========================================================
      # 15. VERIFY WEB BUILD
      # =========================================================
      - name: Verify web build
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING WEB BUILD"
          echo "========================================"

          cd "$PROJECT_DIR"

          test -d dist
          test -s dist/index.html

          echo ""
          echo "dist/index.html:"
          ls -lh dist/index.html

          echo ""
          echo "DIST CONTENT:"
          find dist \
            -maxdepth 5 \
            -type f \
            | sort \
            | head -500


      # =========================================================
      # 16. VERIFY NAMELLO ASSETS
      # =========================================================
      - name: Verify Namello assets
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING NAMELLO ASSETS"
          echo "========================================"

          cd "$PROJECT_DIR"

          echo ""
          echo "Launcher icon:"
          test -s assets/icon-only.png
          ls -lh assets/icon-only.png

          echo ""
          echo "PWA icons:"
          test -s icon-192.png
          test -s icon-512.png

          echo ""
          echo "Layer icons:"

          for f in \
            icon-dashboard-logo.png \
            icon-sessions.png \
            icon-journal.png \
            icon-mt5.jpg \
            icon-tradingview.png
          do
            if [ -s "$f" ]; then
              echo "FOUND: $f"
            else
              echo "WARNING: $f not found"
            fi
          done


      # =========================================================
      # 17. ADD CAPACITOR ANDROID
      # =========================================================
      - name: Add Capacitor Android platform
        run: |
          set -e

          echo "========================================"
          echo "ADDING CAPACITOR ANDROID"
          echo "========================================"

          cd "$PROJECT_DIR"

          if [ -d "android" ]; then
            echo "Existing Android project found."
            echo "Removing generated Android project."
            rm -rf android
          fi

          ./node_modules/.bin/cap add android

          test -d android
          test -d android/app

          echo ""
          echo "Capacitor Android project created."


      # =========================================================
      # 18. SET ANDROID VERSION
      # =========================================================
      - name: Set Android app version
        run: |
          set -e

          echo "========================================"
          echo "SETTING ANDROID VERSION"
          echo "========================================"

          cd "$PROJECT_DIR"

          APP_GRADLE="android/app/build.gradle"

          test -f "$APP_GRADLE"

          sed -i \
            's/versionCode [0-9]*/versionCode 32/' \
            "$APP_GRADLE"

          sed -i \
            's/versionName "[^"]*"/versionName "1.0.31"/' \
            "$APP_GRADLE"

          echo ""
          grep -nE \
            'versionCode|versionName' \
            "$APP_GRADLE"


      # =========================================================
      # 19. INSTALL NAMELLO LAUNCHER ICON
      # =========================================================
      - name: Install Namello launcher icon
        run: |
          set -e

          echo "========================================"
          echo "INSTALLING NAMELLO LAUNCHER ICON"
          echo "========================================"

          cd "$PROJECT_DIR"

          ICON_SOURCE="assets/icon-only.png"

          test -s "$ICON_SOURCE"

          mkdir -p \
            android/app/src/main/res/drawable-nodpi

          cp \
            "$ICON_SOURCE" \
            android/app/src/main/res/drawable-nodpi/namello_launcher.png

          test -s \
            android/app/src/main/res/drawable-nodpi/namello_launcher.png

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST"

          sed -i \
            's#android:icon="@mipmap/ic_launcher"#android:icon="@drawable/namello_launcher"#g' \
            "$MANIFEST"

          sed -i \
            's#android:roundIcon="@mipmap/ic_launcher_round"#android:roundIcon="@drawable/namello_launcher"#g' \
            "$MANIFEST"

          echo ""
          echo "Launcher icon installed."


      # =========================================================
      # 20. SYNC CAPACITOR
      # =========================================================
      - name: Sync Capacitor Android
        run: |
          set -e

          echo "========================================"
          echo "CAPACITOR SYNC"
          echo "========================================"

          cd "$PROJECT_DIR"

          ./node_modules/.bin/cap sync android


      # =========================================================
      # 21. VERIFY ANDROID PROJECT
      # =========================================================
      - name: Verify Android project
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING ANDROID PROJECT"
          echo "========================================"

          cd "$PROJECT_DIR"

          test -d android
          test -d android/app
          test -d android/app/src
          test -d android/app/src/main

          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml

          echo "Android project OK."


      # =========================================================
      # 22. VERIFY VERSION
      # =========================================================
      - name: Verify Android version
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING ANDROID VERSION"
          echo "========================================"

          cd "$PROJECT_DIR"

          APP_GRADLE="android/app/build.gradle"

          VERSION_CODE="$(
            grep -oE \
              'versionCode [0-9]+' \
              "$APP_GRADLE" \
              | head -1 \
              | awk '{print $2}'
          )"

          VERSION_NAME="$(
            grep -oE \
              'versionName "[^"]+"' \
              "$APP_GRADLE" \
              | head -1 \
              | sed 's/versionName //;s/"//g'
          )"

          echo ""
          echo "versionCode: $VERSION_CODE"
          echo "versionName: $VERSION_NAME"

          test "$VERSION_CODE" = "32"
          test "$VERSION_NAME" = "1.0.31"

          echo ""
          echo "Namello 1.0.31 / versionCode 32 verified."


      # =========================================================
      # 23. BUILD APK
      # =========================================================
      - name: Build debug APK
        run: |
          set -e

          echo "========================================"
          echo "BUILDING NAMELLO ANDROID APK"
          echo "========================================"

          cd "$PROJECT_DIR/android"

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug


      # =========================================================
      # 24. VERIFY APK
      # =========================================================
      - name: Verify APK exists
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING APK"
          echo "========================================"

          APK_PATH="$PROJECT_DIR/android/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK_PATH"

          echo ""
          echo "========================================"
          echo "APK BUILD SUCCESSFUL"
          echo "========================================"

          ls -lh "$APK_PATH"


      # =========================================================
      # 25. UPLOAD APK
      # =========================================================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Namello-1.0.31-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
