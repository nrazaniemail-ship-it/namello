name: Namello Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Namello 1.0.31 Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    defaults:
      run:
        working-directory: Namello-1.0.31-PWA

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout source
        uses: actions/checkout@v7


      # =========================================================
      # 2. NODE.JS
      # =========================================================
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22


      # =========================================================
      # 3. JAVA 21
      # =========================================================
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"


      # =========================================================
      # 4. ANDROID SDK
      # =========================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''


      # =========================================================
      # 5. INSTALL ANDROID SDK PACKAGES
      # =========================================================
      - name: Install Android SDK packages
        run: |
          set -e

          echo "========================================"
          echo "ANDROID SDK"
          echo "========================================"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # =========================================================
      # 6. VERIFY TOOLCHAIN
      # =========================================================
      - name: Verify toolchain
        run: |
          set -e

          echo "========================================"
          echo "TOOLCHAIN"
          echo "========================================"

          node --version
          npm --version
          java -version
          adb version


      # =========================================================
      # 7. VERIFY NAMELLO PROJECT
      # =========================================================
      - name: Verify Namello project
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING NAMELLO PROJECT"
          echo "========================================"

          pwd

          echo ""
          echo "PROJECT FILES:"
          ls -la

          echo ""
          echo "Checking required files..."

          test -f package.json
          test -f vite.config.ts
          test -f capacitor.config.ts
          test -f index.html
          test -f version.json

          echo ""
          echo "package.json:"
          cat package.json


      # =========================================================
      # 8. INSTALL PROJECT DEPENDENCIES
      # =========================================================
      - name: Install dependencies
        run: |
          set -e

          echo "========================================"
          echo "INSTALLING NAMELLO DEPENDENCIES"
          echo "========================================"

          npm install \
            --no-audit \
            --no-fund


      # =========================================================
      # 9. VERIFY REQUIRED NPM PACKAGES
      # =========================================================
      - name: Verify build dependencies
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING NPM DEPENDENCIES"
          echo "========================================"

          echo ""
          echo "Vite:"
          ./node_modules/.bin/vite --version

          echo ""
          echo "TypeScript:"
          ./node_modules/.bin/tsc --version

          echo ""
          echo "Capacitor:"
          ./node_modules/.bin/cap --version

          echo ""
          echo "Capacitor Core:"
          node -e "console.log(require.resolve('@capacitor/core'))"

          echo ""
          echo "Capacitor Android:"
          node -e "console.log(require.resolve('@capacitor/android'))"

          echo ""
          echo "All required build dependencies are available."


      # =========================================================
      # 10. VERIFY VERSION FILES
      # =========================================================
      - name: Verify Namello version
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING NAMELLO VERSION"
          echo "========================================"

          echo ""
          echo "version.json:"
          cat version.json

          node - <<'NODE'
          const fs = require('fs');

          const v = JSON.parse(
            fs.readFileSync('version.json', 'utf8')
          );

          console.log('Application version:', v.version);
          console.log('Application versionCode:', v.versionCode);

          if (v.version !== '1.0.31') {
            throw new Error(
              `Expected application version 1.0.31, found ${v.version}`
            );
          }

          if (v.versionCode !== 32) {
            throw new Error(
              `Expected versionCode 32, found ${v.versionCode}`
            );
          }

          console.log('Namello version contract OK.');
          NODE


      # =========================================================
      # 11. RUN TESTS
      # =========================================================
      - name: Run tests
        run: |
          set -e

          echo "========================================"
          echo "RUNNING TESTS"
          echo "========================================"

          npm run test


      # =========================================================
      # 12. TYPESCRIPT CHECK
      # =========================================================
      - name: TypeScript check
        run: |
          set -e

          echo "========================================"
          echo "TYPESCRIPT CHECK"
          echo "========================================"

          npm run typecheck


      # =========================================================
      # 13. BUILD WEB APPLICATION
      # =========================================================
      - name: Build web application
        run: |
          set -e

          echo "========================================"
          echo "BUILDING NAMELLO WEB APPLICATION"
          echo "========================================"

          npm run build


      # =========================================================
      # 14. VERIFY WEB BUILD
      # =========================================================
      - name: Verify web build
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING WEB BUILD"
          echo "========================================"

          test -d dist
          test -s dist/index.html

          echo ""
          echo "dist/index.html:"
          ls -lh dist/index.html

          echo ""
          echo "DIST CONTENT:"
          find dist \
            -maxdepth 5 \
            -type f \
            | sort \
            | head -500


      # =========================================================
      # 15. VERIFY NAMELLO ASSETS
      # =========================================================
      - name: Verify Namello assets
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING NAMELLO ASSETS"
          echo "========================================"

          echo ""
          echo "Launcher icon:"
          test -s assets/icon-only.png
          ls -lh assets/icon-only.png

          echo ""
          echo "PWA icons:"
          test -s icon-192.png
          test -s icon-512.png

          echo ""
          echo "Layer icons:"
          test -s icon-dashboard-logo.png
          test -s icon-sessions.png
          test -s icon-journal.png
          test -s icon-mt5.jpg
          test -s icon-tradingview.png

          echo ""
          echo "All required Namello assets found."


      # =========================================================
      # 16. ADD CAPACITOR ANDROID
      # =========================================================
      - name: Add Capacitor Android platform
        run: |
          set -e

          echo "========================================"
          echo "ADDING CAPACITOR ANDROID"
          echo "========================================"

          if [ -d "android" ]; then
            echo "Android project already exists."
            echo "Removing old generated Android project."

            rm -rf android
          fi

          ./node_modules/.bin/cap add android

          test -d android
          test -d android/app

          echo ""
          echo "Capacitor Android project created successfully."


      # =========================================================
      # 17. SET ANDROID VERSION
      # =========================================================
      - name: Set Android app version
        run: |
          set -e

          echo "========================================"
          echo "SETTING ANDROID VERSION"
          echo "========================================"

          APP_GRADLE="android/app/build.gradle"

          test -f "$APP_GRADLE"

          sed -i \
            's/versionCode [0-9]*/versionCode 32/' \
            "$APP_GRADLE"

          sed -i \
            's/versionName "[^"]*"/versionName "1.0.31"/' \
            "$APP_GRADLE"

          echo ""
          echo "Android version:"
          grep -nE \
            'versionCode|versionName' \
            "$APP_GRADLE"


      # =========================================================
      # 18. INSTALL NAMELLO LAUNCHER ICON
      # =========================================================
      - name: Install Namello launcher icon
        run: |
          set -e

          echo "========================================"
          echo "INSTALLING NAMELLO LAUNCHER ICON"
          echo "========================================"

          ICON_SOURCE="assets/icon-only.png"

          test -s "$ICON_SOURCE"

          echo "Using:"
          echo "$ICON_SOURCE"

          mkdir -p \
            android/app/src/main/res/drawable-nodpi

          cp \
            "$ICON_SOURCE" \
            android/app/src/main/res/drawable-nodpi/namello_launcher.png

          test -s \
            android/app/src/main/res/drawable-nodpi/namello_launcher.png

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST"

          echo ""
          echo "Updating Android launcher icon..."

          sed -i \
            's#android:icon="@mipmap/ic_launcher"#android:icon="@drawable/namello_launcher"#g' \
            "$MANIFEST"

          sed -i \
            's#android:roundIcon="@mipmap/ic_launcher_round"#android:roundIcon="@drawable/namello_launcher"#g' \
            "$MANIFEST"

          echo ""
          echo "Launcher icon installed."

          grep -n \
            'android:icon' \
            "$MANIFEST" || true


      # =========================================================
      # 19. SYNC CAPACITOR
      # =========================================================
      - name: Sync Capacitor Android
        run: |
          set -e

          echo "========================================"
          echo "CAPACITOR SYNC"
          echo "========================================"

          ./node_modules/.bin/cap sync android


      # =========================================================
      # 20. VERIFY ANDROID PROJECT
      # =========================================================
      - name: Verify Android project
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING ANDROID PROJECT"
          echo "========================================"

          test -d android
          test -d android/app
          test -d android/app/src
          test -d android/app/src/main

          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml

          echo ""
          echo "Android project structure OK."


      # =========================================================
      # 21. VERIFY ANDROID VERSION
      # =========================================================
      - name: Verify Android version
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING ANDROID VERSION"
          echo "========================================"

          APP_GRADLE="android/app/build.gradle"

          grep -nE \
            'versionCode|versionName' \
            "$APP_GRADLE"

          VERSION_CODE="$(
            grep -oE \
              'versionCode [0-9]+' \
              "$APP_GRADLE" \
              | head -1 \
              | awk '{print $2}'
          )"

          VERSION_NAME="$(
            grep -oE \
              'versionName "[^"]+"' \
              "$APP_GRADLE" \
              | head -1 \
              | sed 's/versionName //;s/"//g'
          )"

          echo ""
          echo "Detected versionCode: $VERSION_CODE"
          echo "Detected versionName: $VERSION_NAME"

          test "$VERSION_CODE" = "32"
          test "$VERSION_NAME" = "1.0.31"

          echo ""
          echo "Namello 1.0.31 / versionCode 32 verified."


      # =========================================================
      # 22. VERIFY LAUNCHER ICON
      # =========================================================
      - name: Verify launcher icon
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING LAUNCHER ICON"
          echo "========================================"

          ICON="android/app/src/main/res/drawable-nodpi/namello_launcher.png"

          test -s "$ICON"

          echo ""
          echo "Namello launcher icon:"
          ls -lh "$ICON"

          echo ""
          echo "Launcher icon verification OK."


      # =========================================================
      # 23. BUILD APK
      # =========================================================
      - name: Build debug APK
        working-directory: Namello-1.0.31-PWA/android
        run: |
          set -e

          echo "========================================"
          echo "BUILDING NAMELLO ANDROID APK"
          echo "========================================"

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug


      # =========================================================
      # 24. VERIFY APK
      # =========================================================
      - name: Verify APK exists
        run: |
          set -e

          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK_PATH"

          echo ""
          echo "========================================"
          echo "APK BUILD SUCCESSFUL"
          echo "========================================"

          ls -lh "$APK_PATH"


      # =========================================================
      # 25. UPLOAD APK
      # =========================================================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Namello-1.0.31-APK
          path: Namello-1.0.31-PWA/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
