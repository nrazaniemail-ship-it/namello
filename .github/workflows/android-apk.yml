name: Namello Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Namello 1.0.31 Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:

      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify toolchain
        run: |
          set -e
          node --version
          npm --version
          java -version
          adb version

      - name: Find Namello project directory
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "FINDING NAMELLO PROJECT"
          echo "========================================"

          pwd
          echo ""

          echo "Repository root:"
          ls -la

          PROJECT_DIR=""

          # Case 1: Namello is directly in repository root
          if [ -f "package.json" ] && \
             [ -f "vite.config.ts" ] && \
             [ -f "capacitor.config.ts" ]; then
            PROJECT_DIR="."
          fi

          # Case 2: Namello is inside a subdirectory
          if [ -z "$PROJECT_DIR" ]; then
            while IFS= read -r PACKAGE_FILE; do

              DIR="$(dirname "$PACKAGE_FILE")"

              if [ -f "$DIR/vite.config.ts" ] && \
                 [ -f "$DIR/capacitor.config.ts" ]; then

                PROJECT_DIR="$DIR"
                break

              fi

            done < <(
              find . \
                -maxdepth 5 \
                -type f \
                -name package.json \
                -print \
                | sort
            )
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo ""
            echo "ERROR: Namello project directory not found."
            echo ""
            echo "Available package.json files:"
            find . \
              -maxdepth 6 \
              -type f \
              -name package.json \
              -print \
              | sort
            exit 1
          fi

          echo ""
          echo "PROJECT_DIR=$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Project contents:"
          ls -la "$PROJECT_DIR"

      - name: Verify Namello project
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING NAMELLO PROJECT"
          echo "========================================"

          echo "PROJECT_DIR=$PROJECT_DIR"

          test -f "$PROJECT_DIR/package.json"
          test -f "$PROJECT_DIR/vite.config.ts"
          test -f "$PROJECT_DIR/capacitor.config.ts"

          echo ""
          echo "package.json:"
          cat "$PROJECT_DIR/package.json"

      - name: Check package manager files
        run: |
          set -e

          echo "========================================"
          echo "CHECKING PACKAGE MANAGER FILES"
          echo "========================================"

          cd "$PROJECT_DIR"

          if [ -f package-lock.json ]; then
            echo "FOUND: package-lock.json"
            ls -lh package-lock.json
          else
            echo "WARNING: package-lock.json not found"
          fi

          if [ -f npm-shrinkwrap.json ]; then
            echo "FOUND: npm-shrinkwrap.json"
          fi

          if [ -f yarn.lock ]; then
            echo "FOUND: yarn.lock"
          fi

          if [ -f pnpm-lock.yaml ]; then
            echo "FOUND: pnpm-lock.yaml"
          fi

      - name: Install dependencies
        run: |
          set -e

          echo "========================================"
          echo "INSTALLING NAMELLO DEPENDENCIES"
          echo "========================================"

          cd "$PROJECT_DIR"

          echo ""
          echo "Node:"
          node --version

          echo ""
          echo "NPM:"
          npm --version

          echo ""
          echo "Installing dependencies..."

          npm install \
            --include=dev \
            --no-audit \
            --no-fund

          echo ""
          echo "npm install completed."

      - name: Verify installed node_modules
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING NODE_MODULES"
          echo "========================================"

          cd "$PROJECT_DIR"

          test -d node_modules

          echo ""
          echo "Checking Vite package..."

          if [ ! -d "node_modules/vite" ]; then
            echo ""
            echo "ERROR: Vite package was NOT installed."
            echo ""
            echo "npm dependency tree:"
            npm ls vite --depth=0 || true
            echo ""
            echo "package.json devDependencies:"
            node -e "
              const p=require('./package.json');
              console.log(JSON.stringify(p.devDependencies || {}, null, 2));
            "
            exit 1
          fi

          echo "Vite package found."

          echo ""
          echo "Checking TypeScript..."

          test -d node_modules/typescript
          echo "TypeScript package found."

          echo ""
          echo "Checking Capacitor CLI..."

          test -d node_modules/@capacitor/cli
          echo "Capacitor CLI package found."

          echo ""
          echo "Checking Capacitor Core..."

          test -d node_modules/@capacitor/core
          echo "Capacitor Core package found."

          echo ""
          echo "Checking Capacitor Android..."

          test -d node_modules/@capacitor/android
          echo "Capacitor Android package found."

      - name: Verify build dependencies
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING BUILD DEPENDENCIES"
          echo "========================================"

          cd "$PROJECT_DIR"

          echo ""
          echo "Vite:"
          ./node_modules/.bin/vite --version

          echo ""
          echo "TypeScript:"
          ./node_modules/.bin/tsc --version

          echo ""
          echo "Capacitor:"
          ./node_modules/.bin/cap --version

          echo ""
          echo "Capacitor Core:"
          node -e "console.log(require.resolve('@capacitor/core'))"

          echo ""
          echo "Capacitor Android:"
          node -e "console.log(require.resolve('@capacitor/android'))"

          echo ""
          echo "All required dependencies are available."

      - name: Verify Namello version
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING NAMELLO VERSION"
          echo "========================================"

          cd "$PROJECT_DIR"

          test -f version.json

          cat version.json

          node - <<'NODE'
          const fs = require('fs');

          const v = JSON.parse(
            fs.readFileSync('version.json', 'utf8')
          );

          console.log('Application version:', v.version);
          console.log('Application versionCode:', v.versionCode);

          if (v.version !== '1.0.31') {
            throw new Error(
              `Expected version 1.0.31, found ${v.version}`
            );
          }

          if (v.versionCode !== 32) {
            throw new Error(
              `Expected versionCode 32, found ${v.versionCode}`
            );
          }

          console.log('Namello version contract OK.');
          NODE

      - name: Run tests
        run: |
          set -e

          echo "========================================"
          echo "RUNNING TESTS"
          echo "========================================"

          cd "$PROJECT_DIR"

          npm run test

      - name: TypeScript check
        run: |
          set -e

          echo "========================================"
          echo "TYPESCRIPT CHECK"
          echo "========================================"

          cd "$PROJECT_DIR"

          npm run typecheck

      - name: Build web application
        run: |
          set -e

          echo "========================================"
          echo "BUILDING NAMELLO WEB APPLICATION"
          echo "========================================"

          cd "$PROJECT_DIR"

          npm run build

      - name: Verify web build
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING WEB BUILD"
          echo "========================================"

          cd "$PROJECT_DIR"

          test -d dist
          test -s dist/index.html

          echo ""
          echo "dist/index.html:"
          ls -lh dist/index.html

          echo ""
          echo "DIST CONTENT:"
          find dist \
            -maxdepth 5 \
            -type f \
            | sort \
            | head -500

      - name: Verify Namello assets
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING NAMELLO ASSETS"
          echo "========================================"

          cd "$PROJECT_DIR"

          echo ""
          echo "Launcher icon:"
          test -s assets/icon-only.png
          ls -lh assets/icon-only.png

          echo ""
          echo "PWA icons:"
          test -s icon-192.png
          test -s icon-512.png

          echo ""
          echo "Asset verification completed."

      - name: Add Capacitor Android platform
        run: |
          set -e

          echo "========================================"
          echo "ADDING CAPACITOR ANDROID"
          echo "========================================"

          cd "$PROJECT_DIR"

          if [ -d "android" ]; then
            echo "Existing Android project found."
            echo "Removing generated Android project."
            rm -rf android
          fi

          ./node_modules/.bin/cap add android

          test -d android
          test -d android/app

          echo ""
          echo "Capacitor Android project created."

      - name: Set Android app version
        run: |
          set -e

          echo "========================================"
          echo "SETTING ANDROID VERSION"
          echo "========================================"

          cd "$PROJECT_DIR"

          APP_GRADLE="android/app/build.gradle"

          test -f "$APP_GRADLE"

          sed -i \
            's/versionCode [0-9]*/versionCode 32/' \
            "$APP_GRADLE"

          sed -i \
            's/versionName "[^"]*"/versionName "1.0.31"/' \
            "$APP_GRADLE"

          echo ""
          grep -nE \
            'versionCode|versionName' \
            "$APP_GRADLE"

      - name: Install Namello launcher icon
        run: |
          set -e

          echo "========================================"
          echo "INSTALLING NAMELLO LAUNCHER ICON"
          echo "========================================"

          cd "$PROJECT_DIR"

          ICON_SOURCE="assets/icon-only.png"

          test -s "$ICON_SOURCE"

          mkdir -p \
            android/app/src/main/res/drawable-nodpi

          cp \
            "$ICON_SOURCE" \
            android/app/src/main/res/drawable-nodpi/namello_launcher.png

          test -s \
            android/app/src/main/res/drawable-nodpi/namello_launcher.png

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST"

          sed -i \
            's#android:icon="@mipmap/ic_launcher"#android:icon="@drawable/namello_launcher"#g' \
            "$MANIFEST"

          sed -i \
            's#android:roundIcon="@mipmap/ic_launcher_round"#android:roundIcon="@drawable/namello_launcher"#g' \
            "$MANIFEST"

          echo ""
          echo "Launcher icon installed."

      - name: Sync Capacitor Android
        run: |
          set -e

          echo "========================================"
          echo "CAPACITOR SYNC"
          echo "========================================"

          cd "$PROJECT_DIR"

          ./node_modules/.bin/cap sync android

      - name: Verify Android project
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING ANDROID PROJECT"
          echo "========================================"

          cd "$PROJECT_DIR"

          test -d android
          test -d android/app
          test -d android/app/src
          test -d android/app/src/main
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml

          echo "Android project OK."

      - name: Verify Android version
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING ANDROID VERSION"
          echo "========================================"

          cd "$PROJECT_DIR"

          APP_GRADLE="android/app/build.gradle"

          VERSION_CODE="$(
            grep -oE \
              'versionCode [0-9]+' \
              "$APP_GRADLE" \
              | head -1 \
              | awk '{print $2}'
          )"

          VERSION_NAME="$(
            grep -oE \
              'versionName "[^"]+"' \
              "$APP_GRADLE" \
              | head -1 \
              | sed 's/versionName //;s/"//g'
          )"

          echo ""
          echo "versionCode: $VERSION_CODE"
          echo "versionName: $VERSION_NAME"

          test "$VERSION_CODE" = "32"
          test "$VERSION_NAME" = "1.0.31"

          echo ""
          echo "Namello 1.0.31 / versionCode 32 verified."

      - name: Build debug APK
        run: |
          set -e

          echo "========================================"
          echo "BUILDING NAMELLO ANDROID APK"
          echo "========================================"

          cd "$PROJECT_DIR/android"

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Verify APK exists
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING APK"
          echo "========================================"

          APK_PATH="$PROJECT_DIR/android/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK_PATH"

          echo ""
          echo "========================================"
          echo "APK BUILD SUCCESSFUL"
          echo "========================================"

          ls -lh "$APK_PATH"

      - name: Copy APK to fixed artifact path
        run: |
          set -e

          echo "========================================"
          echo "PREPARING APK ARTIFACT"
          echo "========================================"

          APK_PATH="$PROJECT_DIR/android/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK_PATH"

          mkdir -p namello-apk

          cp \
            "$APK_PATH" \
            "namello-apk/Namello-1.0.31-debug.apk"

          ls -lh namello-apk/Namello-1.0.31-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Namello-1.0.31-APK
          path: namello-apk/Namello-1.0.31-debug.apk
          if-no-files-found: error
          retention-days: 14
