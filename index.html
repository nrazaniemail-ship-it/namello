<script>
  // window.storage shim backed by localStorage — matches the same API the app already uses,
  // so no app code needs to change between the in-chat preview and this standalone build.
  window.storage = {
    async get(key) {
      const raw = localStorage.getItem('ns_' + key);
      if (raw === null) throw new Error('not found');
      return { key, value: raw, shared: false };
    },
    async set(key, value) {
      localStorage.setItem('ns_' + key, value);
      return { key, value, shared: false };
    },
    async delete(key) {
      localStorage.removeItem('ns_' + key);
      return { key, deleted: true, shared: false };
    },
    async list(prefix) {
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith('ns_' + (prefix || ''))) keys.push(k.slice(3));
      }
      return { keys, shared: false };
    },
  };
</script>

            const longestIdx = segs.reduce((best, seg, i) => (seg[1] - seg[0] > segs[best][1] - segs[best][0] ? i : best), 0);
            return segs.map((seg, si) => {
              const pathId = `arc-${ri}-${ev.key}-${si}`;
              const arcLen = ((seg[1] - seg[0]) / 360) * 2 * Math.PI * ring.r;
              const label = ev.short || ev.name;
              const canFit = ring.showLabel && si === longestIdx && arcLen > label.length * (ring.fontSize * 0.62) + 6;
              return (
                <g key={pathId}>
                  <path id={pathId} d={describeArc(cx, cy, ring.r, seg[0], seg[1])} stroke={ev.color} strokeWidth={ring.w} fill="none" strokeLinecap="butt" opacity={ev.active ? 1 : 0.35} style={ev.active ? { filter: `drop-shadow(0 0 3px ${ev.color}aa)` } : undefined} />
                  {canFit && (
                    <text fontSize={ring.fontSize + 1} fontFamily="Vazirmatn, sans-serif" fontWeight="800" fill="#0B0E11" stroke="#FFFFFF" strokeWidth={2.2} paintOrder="stroke" opacity={ev.active ? 1 : 0.75}>
                      <textPath href={`#${pathId}`} startOffset="50%" textAnchor="middle" direction="rtl">{label}</textPath>
                    </text>
                  )}
                </g>
              );
            });
          })}
        </g>
      ))}
      <line x1={cx} y1={cy} x2={nowPt.x} y2={nowPt.y} stroke="#E8EAED" strokeWidth="2" strokeLinecap="round" />
      <circle cx={cx} cy={cy} r="4" fill="#E8EAED" />
      <circle cx={nowPt.x} cy={nowPt.y} r="4" fill="#E8EAED" />
    </svg>
  );
}

/* ------------------------- Journal helpers ------------------------- */
function pipSize(pair) {
  if (!pair) return 0.0001;
  if (pair.toUpperCase().includes("JPY")) return 0.01;
  if (pair.toUpperCase().includes("XAU")) return 0.1;
  return 0.0001;
}
function calcPips(pair, direction, entry, exit) {
  const e = parseFloat(entry), x = parseFloat(exit);
  if (isNaN(e) || isNaN(x)) return null;
  const size = pipSize(pair);
  const diff = (x - e) / size;
  const signed = direction === "sell" ? -diff : diff;
  return Math.round(signed * 10) / 10;
}
function sortAsc(trades) { return [...trades].sort((a, b) => (a.date + a.time < b.date + b.time ? -1 : 1)); }
function closeTypeLabel(t) { return t.closeType === "tp" ? "حد سود (TP)" : t.closeType === "sl" ? "حد ضرر (SL)" : t.closeType === "manual" ? "دستی" : ""; }
function computeNextLot(streakType, streakCount, baseLot, minLot, maxLot) {
  let lot;
  if (streakType === "win") {
    const cycle = streakCount % 5;
    lot = cycle === 0 ? baseLot : baseLot * Math.pow(1.1, cycle - 1);
  } else if (streakType === "loss") {
    lot = baseLot / Math.pow(2, Math.min(streakCount - 1, 12));
  } else lot = baseLot;
  lot = Math.max(minLot, Math.min(maxLot, lot));
  return Math.round(lot * 10000) / 10000;
}
function computeDerived(trades, accSettings) {
  const closed = trades.filter(t => t.status === "closed");
  const asc = sortAsc(closed);
  const dateCounters = {};
  const byId = {};
  let running = accSettings.startingBalance;
  sortAsc(trades).forEach(t => {
    dateCounters[t.date] = (dateCounters[t.date] || 0) + 1;
    byId[t.id] = { dailyIndex: dateCounters[t.date] };
  });
  asc.forEach(t => {
    if (t.pnl !== null && t.pnl !== undefined) running += t.pnl;
    byId[t.id] = { ...byId[t.id], balanceAfter: running };
  });
  let streakType = null, streakCount = 0;
  for (let i = asc.length - 1; i >= 0; i--) {
    const p = asc[i].pnl;
    if (p === null || p === undefined) continue;
    const type = p > 0 ? "win" : p < 0 ? "loss" : "breakeven";
    if (type === "breakeven") break;
    if (streakType === null) { streakType = type; streakCount = 1; }
    else if (type === streakType) streakCount++;
    else break;
  }
  const nextLot = computeNextLot(streakType, streakCount, accSettings.baseLot, accSettings.minLot, accSettings.maxLot);
  return { byId, streakType, streakCount, nextLot, currentBalance: running };
}
function rangeFilterTrades(trades, range, todayStr, now) {
  if (range === "daily") return trades.filter(t => t.date === todayStr);
  if (range === "weekly") {
    const start = new Date(now.y, now.m - 1, now.d - 6);
    const end = new Date(now.y, now.m - 1, now.d);
    return trades.filter(t => { const [yy, mo, dd] = t.date.split("-").map(Number); const d = new Date(yy, mo - 1, dd); return d >= start && d <= end; });
  }
  if (range === "monthly") return trades.filter(t => t.date.slice(0, 7) === `${now.y}-${pad2(now.m)}`);
  if (range === "quarterly") {
    const q = Math.floor((now.m - 1) / 3);
    return trades.filter(t => { const [yy, mo] = t.date.split("-").map(Number); return yy === now.y && Math.floor((mo - 1) / 3) === q; });
  }
  if (range === "yearly") return trades.filter(t => t.date.slice(0, 4) === String(now.y));
  return trades;
}
const RANGE_LABEL = { daily: "روزانه", weekly: "هفتگی", monthly: "ماهانه", quarterly: "فصلی", yearly: "سالانه", all: "کل مدت" };

function computeFinancialMetrics(trades, startingBalance) {
  const asc = sortAsc(trades);
  let balance = startingBalance, peakBalance = startingBalance, maxDD = 0, maxDDPercent = 0;
  let grossProfit = 0, grossLoss = 0, wins = 0, losses = 0, biggestWin = 0, biggestLoss = 0;
  let curWin = 0, curLoss = 0, maxWinStreak = 0, maxLossStreak = 0;
  const curve = [{ i: 0, date: "شروع", balance }];
  asc.forEach((t, idx) => {
    const p = t.pnl || 0;
    balance += p;
    curve.push({ i: idx + 1, date: t.date, balance: Math.round(balance * 100) / 100 });
    if (balance > peakBalance) peakBalance = balance;
    const dd = peakBalance - balance;
    if (dd > maxDD) { maxDD = dd; maxDDPercent = peakBalance > 0 ? (dd / peakBalance) * 100 : 0; }
    if (p > 0) { wins++; grossProfit += p; biggestWin = Math.max(biggestWin, p); curWin++; curLoss = 0; maxWinStreak = Math.max(maxWinStreak, curWin); }
    else if (p < 0) { losses++; grossLoss += Math.abs(p); biggestLoss = Math.min(biggestLoss, p); curLoss++; curWin = 0; maxLossStreak = Math.max(maxLossStreak, curLoss); }
    else { curWin = 0; curLoss = 0; }
  });
  const total = asc.length;
  const winRate = total ? Math.round((wins / total) * 100) : null;
  const profitFactor = grossLoss > 0 ? Math.round((grossProfit / grossLoss) * 100) / 100 : (grossProfit > 0 ? null : 0);
  const avgWin = wins ? Math.round((grossProfit / wins) * 100) / 100 : 0;
  const avgLoss = losses ? Math.round((grossLoss / losses) * 100) / 100 : 0;
  const netPnl = Math.round((grossProfit - grossLoss) * 100) / 100;
  return { total, wins, losses, winRate, profitFactor, avgWin, avgLoss, netPnl, maxDD: Math.round(maxDD * 100) / 100, maxDDPercent: Math.round(maxDDPercent * 10) / 10, biggestWin, biggestLoss, maxWinStreak, maxLossStreak, curve, finalBalance: balance };
}
function groupProfitability(trades, keyFn) {
  const map = {};
  trades.forEach(t => { const k = keyFn(t); if (k === undefined || k === null || k === "") return; map[k] = (map[k] || 0) + (t.pnl || 0); });
  return Object.entries(map).map(([name, value]) => ({ name, value: Math.round(value * 100) / 100 })).sort((a, b) => b.value - a.value);
}
function sessionLabelOf(t) { return (t.tags && t.tags[0]) ? t.tags[0].label : "نامشخص"; }

const PARAM_DEFS = {
  lot: { label: "لات", get: t => String(t.lot) },

  system: { label: "سیستم معاملاتی", get: t => t.system || "—" },

};
function build3DData(trades, paramAKey, paramBKey) {
  const A = PARAM_DEFS[paramAKey], B = PARAM_DEFS[paramBKey];
  const cellMap = new Map();
  const aCats = [], bCats = [];
  trades.forEach(t => {
    const a = A.get(t), b = B.get(t);
    if (!aCats.includes(a)) aCats.push(a);
    if (!bCats.includes(b)) bCats.push(b);
    const key = a + "|" + b;
    cellMap.set(key, (cellMap.get(key) || 0) + (t.pnl || 0));
  });
  return { aCats, bCats, cellMap };
}
function get3DRows(trades, paramAKey, paramBKey) {
  const { aCats, bCats, cellMap } = build3DData(trades, paramAKey, paramBKey);
  const rows = [];
  aCats.forEach(a => bCats.forEach(b => {
    const key = a + "|" + b;
    if (cellMap.has(key)) rows.push({ name: `${a} + ${b}`, value: Math.round(cellMap.get(key) * 100) / 100 });
  }));
  return rows.sort((x, y) => y.value - x.value);
}

function Plot3DCombo({ trades, paramAKey, paramBKey }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current || typeof Plotly === "undefined") return;
    const A = PARAM_DEFS[paramAKey], B = PARAM_DEFS[paramBKey];

    const lineX = [], lineY = [], lineZ = [];
    const topX = [], topY = [], topZ = [], topColor = [], topText = [];
    aCats.forEach((a, ai) => {
      bCats.forEach((b, bi) => {
        const key = a + "|" + b;
        if (!cellMap.has(key)) return;
        const z = cellMap.get(key);
        lineX.push(ai, ai, null); lineY.push(bi, bi, null); lineZ.push(0, z, null);
        topX.push(ai); topY.push(bi); topZ.push(z);
        topColor.push(z >= 0 ? "#34D399" : "#F87171");
        topText.push(`${A.label}: ${a}<br>${B.label}: ${b}<br>سودآوری: ${z.toFixed(2)}`);
      });
    });
    const data = [
      { type: "scatter3d", mode: "lines", x: lineX, y: lineY, z: lineZ, line: { color: "#D4A64A", width: 7 }, hoverinfo: "skip", showlegend: false },
      { type: "scatter3d", mode: "markers", x: topX, y: topY, z: topZ, marker: { size: 5, color: topColor }, text: topText, hoverinfo: "text", showlegend: false },
    ];
    const layout = {

      margin: { l: 0, r: 0, t: 10, b: 0 },

  }, [trades, paramAKey, paramBKey]);
  if (!trades.length) return <div className="text-center text-sm py-10" style={{ color: "#6B7280" }}>داده‌ی کافی برای نمودار سه‌بعدی نیست.</div>;

}

    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([["تاریخ ثبت", "هدف"], ...goals.map(g => [g.date, g.text])]), "اهداف");

    const mk2 = (name, data) => XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([["پارامتر", "سودآوری"], ...data.map(d => [d.name, d.value])]), name.slice(0, 31));
    mk2("تحلیل-لات", byLot); mk2("تحلیل-روزهفته", byWeekday); mk2("تحلیل-سیستم", bySystem); mk2("تحلیل-سشن", bySession); mk2("ترکیب-سیستم-روز", bySystemWeekday); mk2("ترکیب-سشن-لات", bySessionLot);
    mk2(`سه‌بعدی-${PARAM_DEFS[param3dX].label}-${PARAM_DEFS[param3dY].label}`, rows3d);

      {/* Toast (replaces window.alert which is blocked in sandboxed preview) */}
      {toast && (
        <div className="fixed left-1/2 z-50 px-4 py-2.5 rounded-xl text-[12px]" style={{ bottom: 76, transform: "translateX(-50%)", background: "#1A1F27", color: "#E8EAED", border: "1px solid #262C36", maxWidth: "90%", textAlign: "center" }}>
          {toast}
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
